# Standalone Nginx example for hosting `u` on its own domain.
# Required standard Nginx modules:
#   http_ssl_module, http_v2_module, http_auth_request_module,
#   http_dav_module, http_gzip_static_module
#
# Place `include /etc/nginx/u_http.conf;` inside your `http { ... }` block
# (alongside `gzip on; gzip_static on;`), then include this site config.

server {
    listen 80;
    listen [::]:80;
    server_name files.example;

    location = /u {
        return 301 https://$host/u/;
    }

    location ^~ /u/ {
        return 301 https://$host$request_uri;
    }

    location = / {
        return 301 https://$host/u/;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name files.example;

    ssl_certificate     /etc/letsencrypt/live/files.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example/privkey.pem;
    ssl_protocols       TLSv1.3;

    server_tokens off;
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/javascript application/json;

    # Keep the portal isolated from other sites' access logs.
    access_log off;

    location = / {
        return 302 https://$host/u/;
    }

    include /etc/nginx/u_locations.conf;

    location / {
        return 444;
    }
}
