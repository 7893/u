# ==============================================================================
# /u/ sub-application: http-level maps, log formats, rate limits & track sink
# Included from the main nginx configuration.
# ==============================================================================

# Block all search engine spiders, web crawlers, and AI / LLM training & retrieval agents
map $http_user_agent $is_crawler_or_llm {
    default 0;
    "~*(Googlebot|Google-Extended|GoogleOther|CloudVertexBot|GoogleInspectionTool|Storebot-Google|AdsBot-Google|Bingbot|AdIdxBot|MicrosoftPreview|msnbot|Slurp|DuckDuckBot|DuckAssistBot|Baiduspider|Sogou.*spider|YisouSpider|360Spider|Bytespider|PetalBot|YandexBot|Applebot|Applebot-Extended|NaverBot|SeznamBot|Qwantify|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|Claude-SearchBot|Claude-User|anthropic-ai|PerplexityBot|Perplexity-User|CCBot|Meta-ExternalAgent|Meta-ExternalFetcher|FacebookBot|facebookexternalhit|Amazonbot|cohere-ai|cohere-training|YouBot|Diffbot|AI2Bot|Ai2Bot-Dolma|Omgili|ImagesiftBot|Timpibot|Webzio-Extended|Kangaroo Bot|MistralAI-User|DeepSeekBot|GLM-Spider|Scrapy|ia_archiver|archive\.org_bot|SemrushBot|AhrefsBot|MJ12bot|DotBot|DataForSeoBot)" 1;
}

# Salted SHA-256 passkey check: Cookie-only for all protected endpoints & forensic logs
map $cookie_u_key $u_authed {
    default 0;
    "~^__U_PASS_SHA256__$" 1;
}

# Cookie OR X-Pass-Key header: used ONLY inside rate-limited location = /u/auth
map "$cookie_u_key:$http_x_pass_key" $u_auth_check {
    default 0;
    "~^__U_PASS_SHA256__:" 1;
    "~^[^:]*:__U_PASS_SHA256__$" 1;
}

# Log every single request touching /u (except /u/track which logs to visitors.jsonl)
# Use normalized $uri so //u/... double-slash requests cannot evade forensic logging
map $uri $is_u_non_track {
    default 0;
    "~^/u/track$" 0;
    "~^/u($|/)" 1;
}

# Raw HTTP / TLS / TCP / Bot / Upload / Download Forensic Log -> __U_ROOT__/logs/requests.jsonl
log_format u_req escape=json
    '{"ts":"$time_iso8601",'
    '"msec":$msec,'
    '"ip":"$remote_addr",'
    '"port":$remote_port,'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"authed":$u_authed,'
    '"bot_flag":$is_crawler_or_llm,'
    '"req_bytes":$request_length,'
    '"sent_bytes":$bytes_sent,'
    '"body_bytes":$body_bytes_sent,'
    '"req_time_s":$request_time,'
    '"proto":"$server_protocol",'
    '"scheme":"$scheme",'
    '"tls_proto":"$ssl_protocol",'
    '"tls_cipher":"$ssl_cipher",'
    '"tls_curve":"$ssl_curve",'
    '"tls_alpn":"$ssl_alpn_protocol",'
    '"tls_early":"$ssl_early_data",'
    '"tls_reused":"$ssl_session_reused",'
    '"tls_curves_offered":"$ssl_curves",'
    '"tls_ciphers_offered":"$ssl_ciphers",'
    '"tcp_rtt_us":"$tcpinfo_rtt",'
    '"tcp_rttvar_us":"$tcpinfo_rttvar",'
    '"tcp_cwnd":"$tcpinfo_snd_cwnd",'
    '"conn":$connection,'
    '"conn_reqs":$connection_requests,'
    '"ua":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"origin":"$http_origin",'
    '"accept_lang":"$http_accept_language",'
    '"sec_ch_ua":"$http_sec_ch_ua",'
    '"sec_ch_mobile":"$http_sec_ch_ua_mobile",'
    '"sec_ch_platform":"$http_sec_ch_ua_platform",'
    '"sec_ch_platform_ver":"$http_sec_ch_ua_platform_version",'
    '"sec_ch_arch":"$http_sec_ch_ua_arch",'
    '"sec_ch_bitness":"$http_sec_ch_ua_bitness",'
    '"sec_ch_model":"$http_sec_ch_ua_model",'
    '"sec_ch_full_ver":"$http_sec_ch_ua_full_version_list",'
    '"sec_fetch_site":"$http_sec_fetch_site",'
    '"sec_fetch_mode":"$http_sec_fetch_mode",'
    '"sec_fetch_dest":"$http_sec_fetch_dest",'
    '"dnt":"$http_dnt",'
    '"gpc":"$http_sec_gpc",'
    '"xff":"$http_x_forwarded_for"}';

# Rich Client Fingerprint & Full Usage Trail Log -> __U_ROOT__/logs/visitors.jsonl
log_format u_visitor escape=json
    '{"ts":"$time_iso8601",'
    '"msec":$msec,'
    '"ip":"$remote_addr",'
    '"port":$remote_port,'
    '"event":"$arg_ev",'
    '"vid":"$arg_vid",'
    '"sid":"$arg_sid",'
    '"authed":$u_authed,'
    '"proto":"$server_protocol",'
    '"tls_proto":"$ssl_protocol",'
    '"tls_cipher":"$ssl_cipher",'
    '"tls_curve":"$ssl_curve",'
    '"tls_alpn":"$ssl_alpn_protocol",'
    '"tls_curves_offered":"$ssl_curves",'
    '"tcp_rtt_us":"$tcpinfo_rtt",'
    '"ua":"$http_user_agent",'
    '"accept_lang":"$http_accept_language",'
    '"sec_ch_platform":"$http_sec_ch_ua_platform",'
    '"sec_ch_platform_ver":"$http_sec_ch_ua_platform_version",'
    '"sec_ch_arch":"$http_sec_ch_ua_arch",'
    '"sec_ch_model":"$http_sec_ch_ua_model",'
    '"sec_ch_mobile":"$http_sec_ch_ua_mobile",'
    '"payload":"$request_body"}';

limit_req_zone  $binary_remote_addr zone=u_general:10m rate=3r/s;
limit_req_zone  $binary_remote_addr zone=u_auth:1m rate=20r/m;
limit_req_zone  $binary_remote_addr zone=u_track:1m rate=60r/m;
limit_req_zone  $binary_remote_addr zone=u_put:1m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=u_view:5m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=upload_perip:1m;

# Internal loopback sink so Nginx natively reads POST /u/track body into RAM with zero external daemons
server {
    listen 127.0.0.1:__U_TRACK_PORT__;
    access_log off;
    return 204;
}
