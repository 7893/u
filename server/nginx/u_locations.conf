# ==============================================================================
# /u/ sub-application: HTTPS routes, auth, tracking, upload & deliverables
# Self-contained root: __U_ROOT__/{public,data,logs}
# Standard Nginx modules only (ssl, auth_request, dav, gzip_static).
# Included inside an HTTPS server block. install-release renders all __U_*__ tokens.
# ==============================================================================

access_log __U_ROOT__/logs/requests.jsonl u_req if=$is_u_non_track;

location = /u {
    if ($is_crawler_or_llm) {
        return 444;
    }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noai, noimageai" always;
    return 301 __PUBLIC_ORIGIN__/u/;
}

location = /u/ {
    if ($is_crawler_or_llm) {
        return 444;
    }
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, max-image-preview:none, max-video-preview:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header Accept-CH "Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform, Sec-CH-UA-Platform-Version, Sec-CH-UA-Arch, Sec-CH-UA-Bitness, Sec-CH-UA-Model, Sec-CH-UA-Full-Version-List" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept-Encoding" always;
    alias __U_ROOT__/public/;
    index index.html;
    default_type text/html;
    limit_req zone=u_general burst=10 nodelay;
}

location = /u/index.html {
    internal;
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, max-image-preview:none, max-video-preview:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header Accept-CH "Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform, Sec-CH-UA-Platform-Version, Sec-CH-UA-Arch, Sec-CH-UA-Bitness, Sec-CH-UA-Model, Sec-CH-UA-Full-Version-List" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept-Encoding" always;
    alias __U_ROOT__/public/index.html;
    default_type text/html;
}

location ^~ /u/pdfjs/ {
    if ($is_crawler_or_llm) {
        return 444;
    }
    if ($uri ~ "/\.") {
        return 444;
    }
    alias __U_ROOT__/public/pdfjs/;
    autoindex off;
    types {
        application/javascript mjs js;
        application/wasm wasm;
        application/octet-stream bcmap pfb;
        font/ttf ttf;
    }
    default_type application/octet-stream;
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    add_header Vary "Accept-Encoding" always;
    limit_req zone=u_view burst=60 nodelay;
}

location ^~ /u/fonts/ {
    if ($is_crawler_or_llm) {
        return 444;
    }
    if ($uri ~ "/\.") {
        return 444;
    }
    alias __U_ROOT__/public/fonts/;
    autoindex off;
    types {
        font/woff2 woff2;
    }
    default_type font/woff2;
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    limit_req zone=u_general burst=15 nodelay;
}

location = /u/app.js {
    if ($is_crawler_or_llm) {
        return 444;
    }
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept-Encoding" always;
    alias __U_ROOT__/public/app.js;
    default_type application/javascript;
    limit_req zone=u_general burst=15 nodelay;
}

location = /u/app.css {
    if ($is_crawler_or_llm) {
        return 444;
    }
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept-Encoding" always;
    alias __U_ROOT__/public/app.css;
    default_type text/css;
    limit_req zone=u_general burst=15 nodelay;
}

# Internal auth_request subrequests execute in ACCESS phase (STRICTLY AFTER limit_req PREACCESS phase)
location = /_u_check_passkey {
    internal;
    access_log off;
    if ($u_auth_check = 0) {
        return 401;
    }
    return 204;
}

location = /_u_check_cookie_401 {
    internal;
    access_log off;
    # Must match /u/put/ limit: auth_request subrequests inherit the main request's
    # Content-Length header, so inheriting a low http-level client_max_body_size would
    # reject uploads with 413 -> HTTP 500 from auth_request.
    client_max_body_size 1g;
    if ($u_authed = 0) {
        return 401;
    }
    return 204;
}

location = /_u_check_cookie_403 {
    internal;
    access_log off;
    if ($u_authed = 0) {
        return 403;
    }
    return 204;
}

location = /u/auth {
    if ($is_crawler_or_llm) {
        return 444;
    }
    limit_req zone=u_auth burst=4 nodelay;
    auth_request /_u_check_passkey;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noai, noimageai" always;
    root __U_ROOT__/public;
    open_file_cache off;
    try_files /__u_auth_never__ @u_auth_ok;
}

location @u_auth_ok {
    internal;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noai, noimageai" always;
    add_header Set-Cookie "u_key=__U_PASS_SHA256__; Path=/u; Max-Age=604800; HttpOnly; Secure; SameSite=Strict" always;
    return 204;
}

location = /u/logout {
    if ($request_method != "POST") {
        return 444;
    }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Set-Cookie "u_key=; Path=/u; Max-Age=0; HttpOnly; Secure; SameSite=Strict" always;
    return 204;
}

location = /u/track {
    if ($request_method != "POST") {
        return 444;
    }
    if ($is_crawler_or_llm) {
        return 444;
    }
    limit_req zone=u_track burst=40 nodelay;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    access_log __U_ROOT__/logs/visitors.jsonl u_visitor;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://127.0.0.1:__U_TRACK_PORT__;
}

location ^~ /u/put/ {
    if ($request_method != "PUT") {
        return 444;
    }
    if ($is_crawler_or_llm) {
        return 444;
    }
    if ($uri ~ "/\.") {
        return 444;
    }
    limit_req zone=u_put burst=15 nodelay;
    limit_conn upload_perip 6;
    auth_request /_u_check_cookie_401;
    alias __U_ROOT__/data/inbox/;
    client_body_temp_path __U_ROOT__/data/.tmp;
    client_max_body_size 1g;
    client_body_timeout 300s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    dav_methods PUT;
    create_full_put_path off;
    dav_access user:rw group:rw;
}

location = /u/manifest.json {
    if ($is_crawler_or_llm) { return 444; }
    limit_req zone=u_general burst=15 nodelay;
    auth_request /_u_check_cookie_403;
    open_file_cache off;
    alias __U_ROOT__/public/manifest.json;
    default_type application/json;
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-cache" always;
    add_header Vary "Accept-Encoding" always;
}

location = /u/stats.json {
    if ($is_crawler_or_llm) { return 444; }
    limit_req zone=u_general burst=15 nodelay;
    auth_request /_u_check_cookie_403;
    open_file_cache off;
    alias __U_ROOT__/public/stats.json;
    default_type application/json;
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-cache" always;
    add_header Vary "Accept-Encoding" always;
}

location ^~ /u/files/ {
    if ($is_crawler_or_llm) { return 444; }
    if ($uri ~ "/\.") { return 444; }
    limit_req zone=u_general burst=15 nodelay;
    auth_request /_u_check_cookie_403;
    alias __U_ROOT__/data/deliverables/;
    autoindex off;
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "private, no-cache" always;
}

location ^~ /u/view/ {
    if ($is_crawler_or_llm) { return 444; }
    if ($uri ~ "/\.") { return 444; }
    limit_req zone=u_view burst=120 nodelay;
    auth_request /_u_check_cookie_403;
    alias __U_ROOT__/data/deliverables/;
    autoindex off;
    __U_ALT_SVC_HEADER__
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; object-src 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, noai, noimageai" always;
    add_header TDM-Reservation "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "private, no-cache" always;
}

# Explicitly reject all other /u/* paths (including logs/data/public) while logging probes in requests.jsonl
location ^~ /u/ {
    return 444;
}
